# GoReleaser config (SASASH.8): prebuilt releases for macOS + Linux.
#
# Local proof, no push:   make snapshot   (== goreleaser release --snapshot --clean)
# Real release:           git tag vX.Y.Z && git push origin vX.Y.Z  -> .github/workflows/release.yml
#
# Version: none injected. cmd/sasash/version.go reads runtime/debug.ReadBuildInfo,
# and Go >= 1.24 stamps the main module version from the git tag at build time,
# so a binary built at tag v0.1.0 prints v0.1.0 (a snapshot prints a pseudo-version).
version: 2

project_name: sasash

builds:
  - id: sasash
    main: ./cmd/sasash
    binary: sasash
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tarball
    ids:
      - sasash
    formats:
      - tar.gz
    # install.sh derives this name: sasash_<version-without-v>_<os>_<arch>.tar.gz.
    # Change it there too if you change it here.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  # install.sh downloads exactly this name next to the tarball.
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: nadavushka-dev
    name: sasash
  # v0.1.0-rc1 style tags become pre-releases automatically.
  prerelease: auto
